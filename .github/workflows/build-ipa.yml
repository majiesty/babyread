name: build-ipa

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: 取回代码
        uses: actions/checkout@v4

      - name: 还原图标（base64 → png）
        run: |
          python3 -c "import base64;open('App/Assets.xcassets/AppIcon.appiconset/icon-1024.png','wb').write(base64.b64decode(open('icon.b64').read()))"
          file App/Assets.xcassets/AppIcon.appiconset/icon-1024.png

      - name: 生成内置语音（edge-tts，1032 条）
        run: |
          pip3 install --break-system-packages --quiet edge-tts
          python3 scripts/regen_audio.py
          echo "audio files: $(ls App/www/audio | wc -l)"

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（不签名，交给巨魔签）
        run: |
          set -o pipefail
          xcodebuild \
            -project BabyRead.xcodeproj \
            -scheme BabyRead \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build | tail -40

      - name: 打包成 ipa
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/BabyRead.app" Payload/
          zip -qry BabyRead.ipa Payload
          ls -lh BabyRead.ipa
          unzip -l BabyRead.ipa | grep -c "\.mp3" || true

      - name: 校验内置语音数量
        run: |
          N=$(unzip -l BabyRead.ipa | grep -c "\.mp3" || true)
          echo "mp3 in ipa: $N"
          if [ "$N" -lt 900 ]; then echo "内置语音缺失！"; exit 1; fi

      - name: 发布到 Release（供匿名下载）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.8 BabyRead.ipa \
            --title "宝宝启蒙跟读 v1.8（巨魔可用）" \
            --notes "与安卓 v1.8 同一份页面；iPad 布局与功能不变。" \
            2>/dev/null || gh release upload v1.6 BabyRead.ipa --clobber
